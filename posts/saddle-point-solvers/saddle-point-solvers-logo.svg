    <text x="512" y="878" fill="#23394d" font-size="30" font-weight="700" letter-spacing=".4">SADDLE POINT SOLVERS</text>
    <text x="512" y="930" fill="#778899" font-size="16" letter-spacing="1">JADDLE  /  OPTIMISATION STORIES</text>
